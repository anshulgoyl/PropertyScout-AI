[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "propertyscout-ai"
version = "0.1.0"
description = "A LangGraph-based real-estate acquisition workflow"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langchain>=1.0,<2.0",
    "langchain-keenable>=0.1,<1.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "pydantic>=2.7,<3.0",
    "pypdf>=5.0,<7.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: calls a configured external model provider"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".tools", ".uv-cache", ".venv"]
